worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting zone for API Gateway protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream auth_service {
        server auth-service:8001;
    }

    upstream persona_service {
        server persona-service:8002;
    }

    upstream meeting_service {
        server meeting-service:8003;
    }

    upstream ai_service {
        server ai-service:8004;
    }

    upstream analytics_service {
        server analytics-service:8005;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Gateway Security Headers
        add_header X-Gateway "AuraMeet-Microservices-Gateway" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Gateway Health Endpoint
        location ~ ^/(health|gateway/health)$ {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway","architecture":"microservices"}';
        }

        # Auth Service (:8001)
        location /api/v1/auth {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
        }

        # Uploaded Static Files (Avatars) served by Auth Service from shared volume
        location /uploads/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Persona & Knowledge RAG Service (:8002)
        location /api/v1/personas {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://persona_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
        }

        # Live Meeting & Avatar Service (:8003) — REST Sessions
        location /api/v1/sessions {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://meeting_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
        }

        # Live Meeting & Avatar Service (:8003) — WebSocket Streams
        location /ws/ {
            proxy_pass http://meeting_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # AI & Guardrails Service (:8004)
        location /api/v1/ai {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
        }

        # Analytics, Schedule, Templates & Kafka Monitor Service (:8005)
        location ~ ^/api/v1/(templates|schedule|stats|kafka) {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://analytics_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Next.js App (default route)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
