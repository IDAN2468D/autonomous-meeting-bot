services:
  mongodb:
    image: mongo:7
    container_name: aurameet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: aurameet-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aurameet-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aurameet-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: aurameet-auth-service
    ports:
      - "8001:8001"
    env_file:
      - path: ./.env
        required: false
    environment:
      SERVICE_NAME: auth-service
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: meeting_bot_db
      UPLOADS_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:8088
      CORS_ORIGINS: http://localhost:3000,http://localhost:8088
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  persona-service:
    build:
      context: .
      dockerfile: services/persona-service/Dockerfile
    container_name: aurameet-persona-service
    ports:
      - "8002:8002"
    env_file:
      - path: ./.env
        required: false
    environment:
      SERVICE_NAME: persona-service
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: meeting_bot_db
      CHROMA_PERSIST_DIR: /app/chroma_data
      UPLOADS_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:8088
      CORS_ORIGINS: http://localhost:3000,http://localhost:8088
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: aurameet-ai-service
    ports:
      - "8004:8004"
    env_file:
      - path: ./.env
        required: false
    environment:
      SERVICE_NAME: ai-service
      CORS_ORIGINS: http://localhost:3000,http://localhost:8088
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: aurameet-analytics-service
    ports:
      - "8005:8005"
    env_file:
      - path: ./.env
        required: false
    environment:
      SERVICE_NAME: analytics-service
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: meeting_bot_db
      CORS_ORIGINS: http://localhost:3000,http://localhost:8088
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  meeting-service:
    build:
      context: .
      dockerfile: services/meeting-service/Dockerfile
    container_name: aurameet-meeting-service
    ports:
      - "8003:8003"
    env_file:
      - path: ./.env
        required: false
    environment:
      SERVICE_NAME: meeting-service
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: meeting_bot_db
      AI_SERVICE_URL: http://ai-service:8004
      PERSONA_SERVICE_URL: http://persona-service:8002
      ANALYTICS_SERVICE_URL: http://analytics-service:8005
      CORS_ORIGINS: http://localhost:3000,http://localhost:8088
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_started
      persona-service:
        condition: service_started
      analytics-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8088
        NEXT_PUBLIC_WS_URL: ws://localhost:8088
    container_name: aurameet-frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - persona-service
      - meeting-service
      - analytics-service
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: aurameet-gateway
    ports:
      - "8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - persona-service
      - meeting-service
      - ai-service
      - analytics-service
      - frontend
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  uploads_data:
