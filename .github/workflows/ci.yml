name: CI — AuraMeet AI Microservices

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  microservice-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - persona-service
          - meeting-service
          - ai-service
          - analytics-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies for ${{ matrix.service }}
        run: pip install -r requirements.txt
      - name: Run pytest suite
        env:
          LLM_PROVIDER: demo
          DID_MOCK_MODE: "true"
          KAFKA_ENABLED: "false"
        run: pytest -v

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: TypeScript & Next.js production build
        run: npm run build
